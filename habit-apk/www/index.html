<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<title>Habit Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ TODAY SCREEN ============ -->
<main id="screen-today" class="screen active">
  <header class="top">
    <div id="yearmap" aria-label="Map of the year"></div>
    <div class="datebox">
      <div id="date-weekday"></div>
      <div id="date-day"></div>
      <div id="date-month"></div>
      <div id="date-doy"></div>
    </div>
  </header>

  <section id="habit-list" class="habits"></section>
  <div id="empty-hint" class="empty" hidden>No habits yet. Tap <b>+</b> to add your first one.</div>
</main>

<!-- ============ OUTPUT PROGRESS SCREEN ============ -->
<main id="screen-output" class="screen">
  <h1 class="title">Output Progress</h1>
  <div class="seg" id="out-tabs">
    <button data-tab="weeks" class="on">Weekly</button>
    <button data-tab="months">Monthly</button>
    <button data-tab="years">Yearly</button>
  </div>
  <div id="out-list" class="out-list"></div>
  <button id="btn-export-all" class="wide">Export everything (one workbook)</button>
</main>

<!-- ============ BOTTOM NAV ============ -->
<nav class="nav">
  <button id="nav-today" class="on">Today</button>
  <button id="fab" class="fab" aria-label="Add habit">+</button>
  <button id="nav-output">Output Progress</button>
</nav>

<!-- ============ ADD / EDIT SHEET ============ -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <h2 id="sheet-title">New habit</h2>

    <label>Name
      <input id="f-name" type="text" maxlength="30" placeholder="e.g. Stretching" autocomplete="off">
    </label>

    <div class="field">Icon</div>
    <div id="f-icons" class="icons"></div>

    <div class="field">How often?</div>
    <div class="seg" id="f-freq">
      <button data-freq="day" class="on">Daily</button>
      <button data-freq="week">Weekly</button>
      <button data-freq="month">Monthly</button>
    </div>

    <label>Times per <span id="f-period">day</span>
      <div class="stepper">
        <button id="f-minus" type="button">−</button>
        <output id="f-target">1</output>
        <button id="f-plus" type="button">+</button>
      </div>
    </label>
    <div id="f-hint" class="hint"></div>

    <div class="row">
      <button id="f-delete" class="danger" hidden>Delete</button>
      <span class="grow"></span>
      <button id="f-cancel" class="ghost">Cancel</button>
      <button id="f-save">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="exceljs.min.js"></script>
<script src="scoring.js"></script>
<script src="report.js"></script>
<script src="report-export.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
